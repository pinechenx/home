<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 流明灵石的个人主页</title>
    <meta name="author" content="流明灵石" />
    <meta name="description" content="页面不存在 - 流明灵石的个人主页" />
    <meta name="robots" content="noindex" />

    <script>

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        text-rendering: optimizeSpeed;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
        background-color: #141518;
      }

      .bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        object-fit: cover;
        backface-visibility: hidden;
        image-rendering: auto;
        filter: brightness(0.85);
        animation: bg-settle 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s backwards;
      }

      .bg-veil {
        filter: blur(10px) brightness(0.3);
        transform: translate3d(0, 0, 0) scale(1.2);
        animation: veil-out 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards;
      }

      @keyframes bg-settle {
        from {
          transform: translate3d(0, 0, 0) scale(1.2);
        }
        to {
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes veil-out {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1.2);
        }
        to {
          opacity: 0;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
      }

      .content {
        text-align: center;
      }

      .rise {
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }

      body.ready .rise {
        opacity: 1;
        transform: translateY(0);
      }

      body.ready .ghost-box {
        transition-delay: 0.45s;
      }
      body.ready .code {
        transition-delay: 0.55s;
      }
      body.ready .msg {
        transition-delay: 0.68s;
      }
      body.ready .btn-box {
        transition-delay: 0.8s;
      }

      .ghost {
        display: block;
        width: 84px;
        margin: 0 auto 10px;
        animation: ghost-float 3s ease-in-out 1.5s infinite;
      }

      @keyframes ghost-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .code {
        margin: 0;
        font-size: clamp(5rem, 20vw, 8rem);
        line-height: 1.1;
        font-weight: 700;
        color: #fff;
      }

      .msg {
        margin: 10px 0 30px;
        font-size: 1.2rem;
        color: #fff;
      }

      .btn {
        display: inline-block;
        background-color: #f7f7f7;
        color: #000;
        font-size: 1rem;
        font-family: sans-serif;
        text-decoration: none;
        border-radius: 8px;
        padding: 12px 32px;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        will-change: transform, box-shadow;
        transform: translateZ(0);
      }

      .btn:hover {
        box-shadow: 0 8px 16px -4px #2c2d300c;
        transform: translateY(-2px) translateZ(0);
      }

      footer {
        width: 100%;
        padding: 16px 0;
        opacity: 0.5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        row-gap: 4px;
        font-size: 13px;
        z-index: 1;
        white-space: nowrap;
        transition: opacity 0.3s ease;
        margin-top: auto;
      }

      footer:hover {
        opacity: 0.8;
      }

      footer .text {
        color: #fff;
        padding: 0 5px;
      }

      footer .link {
        color: #fff;
        text-decoration: none;
        transition: opacity 0.3s ease;
      }

      footer .link:hover {
        opacity: 0.8;
        text-decoration: underline;
      }

      footer .icp-icon {
        vertical-align: -3px;
        padding-right: 5px;
        border: 0;
      }

      @media (max-width: 480px) {
        footer .text {
          padding: 0 3px;
        }
        .msg {
          font-size: 1.1rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <img class="bg" alt="" aria-hidden="true" decoding="async" loading="eager" draggable="false" />
    <img class="bg bg-veil" alt="" aria-hidden="true" decoding="async" loading="eager" draggable="false" />

    <main>
      <div class="content">
        <div class="rise ghost-box">
          <img class="ghost" src="/images/icons/ghost_color.svg" alt="" draggable="false" />
        </div>
        <h1 class="rise code">404</h1>
        <p class="rise msg">你访问的页面不存在或已被移动</p>
        <div class="rise btn-box">
          <a class="btn" href="/">返回首页</a>
        </div>
      </div>
    </main>

    <footer>
      <span class="text">Copyright © <span id="year">2026</span></span>
      <span class="text">Made by 流明灵石</span>
      <span class="text">
        <a class="link" href="https://beian.miit.gov.cn" target="_blank">赣ICP备18008477号-3</a>
      </span>
      <span class="text">
        <img class="icp-icon" src="https://s2.loli.net/2024/10/27/MaB9VmiEwrT1xje.png" alt="备案图标" />
        <a class="link" href="https://beian.mps.gov.cn/#/query/webSearch?code=36100002000260" target="_blank">
          赣公网安备36100002000260
        </a>
      </span>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear()

      // CDN 失败或超时回退本地图片
      ;(function () {
        var bgUrl = 'https://bing.ee123.net/img/'
        var fallbackUrl = '/images/bg1.jpg'
        var bgs = document.querySelectorAll('.bg')
        var veil = document.querySelector('.bg-veil')
        var revealed = false

        function reveal(url) {
          if (revealed) return
          revealed = true
          for (var i = 0; i < bgs.length; i++) bgs[i].src = url
          document.body.classList.add('ready')
        }

        veil.addEventListener('animationend', function () {
          veil.remove()
        })

        var loader = new Image()
        loader.onload = function () {
          reveal(bgUrl)
        }
        loader.onerror = function () {
          reveal(fallbackUrl)
        }
        loader.src = bgUrl

        setTimeout(function () {
          reveal(fallbackUrl)
        }, 8000)
      })()
    </script>
  </body>
</html>
